  <rect x="288" y="36" width="1272" height="72" rx="28" fill="#0c141f"/><path d="M288 108h1272" class="line"/><rect x="324" y="54" width="276" height="38" rx="10" fill="#111b27" stroke="#263241"/><text x="347" y="78" class="m small">⌕  Search workspace</text><rect x="1460" y="51" width="74" height="44" rx="12" fill="#73ffc5"/><text x="1497" y="79" text-anchor="middle" fill="#07110e" font-size="14" font-weight="700">+ Create</text>
  <text x="332" y="158" class="g small" font-weight="650">Provider access</text><text x="332" y="202" class="w" font-size="38" font-weight="700">Connections</text><text x="332" y="234" class="m small">Connect only the accounts and permissions required for approved publishing workflows.</text>
  <rect x="332" y="272" width="570" height="240" rx="18" fill="url(#card)" stroke="#263241"/><rect x="362" y="302" width="54" height="54" rx="14" fill="#1769aa"/><text x="389" y="338" text-anchor="middle" fill="#fff" font-size="26" font-weight="800">in</text><text x="436" y="320" class="w h2">LinkedIn</text><text x="436" y="345" class="m tiny">Organization publishing</text><rect x="782" y="307" width="90" height="28" rx="14" fill="#12372d"/><text x="827" y="326" text-anchor="middle" class="g tiny">Connected</text><path d="M362 377h510" class="line"/><text x="362" y="410" class="m tiny">DESTINATION</text><text x="362" y="437" class="w small" font-weight="650">Northstar Product Studio</text><text x="362" y="466" class="m tiny">Scopes: openid · profile · w_organization_social</text><rect x="738" y="422" width="134" height="42" rx="10" fill="#151f2e" stroke="#354252"/><text x="805" y="448" text-anchor="middle" class="w tiny">Manage account</text>
  <rect x="922" y="272" width="600" height="240" rx="18" fill="url(#card)" stroke="#263241"/><rect x="952" y="302" width="54" height="54" rx="14" fill="#1877f2"/><text x="979" y="340" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">f</text><text x="1026" y="320" class="w h2">Meta</text><text x="1026" y="345" class="m tiny">Facebook and Instagram destinations</text><rect x="1392" y="307" width="100" height="28" rx="14" fill="#12372d"/><text x="1442" y="326" text-anchor="middle" class="g tiny">Connected</text><path d="M952 377h540" class="line"/><text x="952" y="410" class="m tiny">DESTINATIONS</text><text x="952" y="437" class="w small" font-weight="650">Northstar Studio · Facebook Page</text><text x="952" y="462" class="s tiny">@northstarstudio · Instagram professional</text><rect x="1358" y="422" width="134" height="42" rx="10" fill="#151f2e" stroke="#354252"/><text x="1425" y="448" text-anchor="middle" class="w tiny">Manage account</text>
  <rect x="332" y="536" width="1190" height="284" rx="18" fill="url(#card)" stroke="#263241"/><text x="362" y="578" class="w h2">Connection security</text><text x="362" y="603" class="m small">Provider credentials are encrypted and scoped to the workspace and connection context.</text>
  <g><circle cx="382" cy="657" r="20" fill="#12372d"/><text x="382" y="663" text-anchor="middle" class="g">✓</text><text x="420" y="651" class="w small" font-weight="650">Encrypted token envelopes</text><text x="420" y="674" class="m tiny">Tokens cannot be moved between connections unnoticed.</text>
  <circle cx="382" cy="733" r="20" fill="#1d3650"/><text x="382" y="739" text-anchor="middle" fill="#65a8ff">⌁</text><text x="420" y="727" class="w small" font-weight="650">Least-privilege permissions</text><text x="420" y="750" class="m tiny">Publishing is blocked when required scopes are missing.</text>
  <circle cx="950" cy="657" r="20" fill="#302b52"/><text x="950" y="663" text-anchor="middle" fill="#a99bff">◇</text><text x="988" y="651" class="w small" font-weight="650">Explicit API versions</text><text x="988" y="674" class="m tiny">Adapter requests are pinned to reviewed provider versions.</text>
  <circle cx="950" cy="733" r="20" fill="#442a2c"/><text x="950" y="739" text-anchor="middle" fill="#ff9a8f">!</text><text x="988" y="727" class="w small" font-weight="650">Fail-closed delivery</text><text x="988" y="750" class="m tiny">Unsupported media and ambiguous retries stop safely.</text></g>
  <rect x="362" y="782" width="1130" height="1" fill="#263241"/><text x="362" y="808" class="m tiny">Live publishing requires provider credentials, approved scopes, and an authorized destination.</text>
